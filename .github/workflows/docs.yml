name: Build and deploy docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libginac-dev pkg-config

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" pexpect pybind11
          pip install -r doc/requirements.txt

      - name: Build docs
        run: make -C doc html

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
