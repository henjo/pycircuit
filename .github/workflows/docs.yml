name: Build and deploy docs

on:
  push:
    branches: [master]
    paths:
      - 'doc/**'
      - 'pycircuit/**'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
      - 'scripts/fetch_howland_models.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libginac-dev pkg-config

      - name: Install dependencies
        run: pip install -e ".[docs,ginac]"

      ## Examples 12 and 13 need vendor SPICE models that cannot be
      ## committed.  The script downloads them; the AD8606 may fail (its
      ## site refuses some scripted clients), which is a warning -- the
      ## pages then show their recorded results and say so.  The cache holds
      ## the PC817 model extracted from the 145 MB LTspice installer.
      - name: Cache the extracted LTspice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/pycircuit
          key: howland-models-${{ hashFiles('scripts/fetch_howland_models.py') }}

      - name: Fetch vendor models for examples 12 and 13
        run: python scripts/fetch_howland_models.py

      - name: Build docs
        run: make -C doc html

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
