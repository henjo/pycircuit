[pytest]
## Every run prints its 20 slowest tests, and conftest.py records every
## test's duration under test_timings/ (Andreas, 2026-09-08).
## --maxschedchunk=1: see conftest.pytest_collection_modifyitems.
## -n 8 (Andreas, 2026-09-23): the suite runs on 8 xdist workers by default.
## The full gate had been run at -n 4 -- 2131 s wall for 8460 test-seconds,
## i.e. sum-bound -- on a 24-core box.  BLAS is held to one thread per worker
## (conftest.py), which is what made more workers pay rather than contend.
## An explicit -n on the command line overrides this (-n 0: serial, for
## pdb and single-test runs).
## -p no:randomly (2026-10-03): pytest-randomly is installed for ON-DEMAND
## shuffled runs (`pytest -p randomly --randomly-seed=N`; naming the plugin
## again on the command line unblocks it); the default run and the recorded
## gate keep their deterministic longest-first order.
addopts = --durations=20 --maxschedchunk=1 -n 8 -p no:randomly
## Stacks of every thread from a test that has not finished in 15 minutes
## (the longest test takes ~2): a hang names itself in the log.
faulthandler_timeout = 900
markers =
    slow: transient/ODE-integration tests (see doc/architecture.md P15)
    fast_tier: kept in `--tier fast` although it takes 5 s or more -- the cheapest test that enters a library function no faster test reaches (chosen by per-test coverage, 2026-10-04)

## THE WARNINGS POLICY (2026-10-01; `pycircuit/circuit/tests/_warnpolicy.py`):
## pycircuit's own warnings (`pycircuit.circuit.simwarnings`) are ERRORS
## unless the test expects them -- `with quiet(AccuracyWarning, ...)` names
## the categories a block may raise, `pytest.warns` / a recording block
## asserts on one.  Until then ~800 blocks ignored every warning, so a new
## library warning was invisible to the suite.  Other libraries' warnings
## (numpy's) are not affected.
filterwarnings =
    error::pycircuit.circuit.simwarnings.SimulationWarning

## Slow tests run by default.
##
## They used to be deselected by default (`addopts = -m "not slow"`) because
## run serially they were roughly half the suite's wall time.  Under
## pytest-xdist that is no longer true -- they fill workers that would
## otherwise sit idle.  Measured with `-n 8`: 52.9 s for the whole suite
## against 55.1 s for the fast subset, so deselecting them bought nothing
## and cost coverage.
##
## The old default was flagged in this file as a real hazard, and it was:
## these are the only tests comparing the perturbation analysis against a
## time-domain reference -- the evidence class that caught the g_2 sign
## error the published-formula gates could not see.  CI invoked pytest
## without `-m ""`, so it inherited the default and silently skipped them.
##
##   pytest pycircuit                 -> everything (default)
##   pytest pycircuit -m slow         -> only the slow ones
##   pytest pycircuit -m "not slow"   -> fast subset, on demand
