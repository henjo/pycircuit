[pytest]
markers =
    slow: transient/ODE-integration tests (see doc/architecture.md P15)

## Slow tests run by default.
##
## They used to be deselected by default (`addopts = -m "not slow"`) because
## run serially they were roughly half the suite's wall time.  Under
## pytest-xdist that is no longer true -- they fill workers that would
## otherwise sit idle.  Measured with `-n 8`: 52.9 s for the whole suite
## against 55.1 s for the fast subset, so deselecting them bought nothing
## and cost coverage.
##
## The old default was flagged in this file as a real hazard, and it was:
## these are the only tests comparing the perturbation analysis against a
## time-domain reference -- the evidence class that caught the g_2 sign
## error the published-formula gates could not see.  CI invoked pytest
## without `-m ""`, so it inherited the default and silently skipped them.
##
##   pytest pycircuit                 -> everything (default)
##   pytest pycircuit -m slow         -> only the slow ones
##   pytest pycircuit -m "not slow"   -> fast subset, on demand
