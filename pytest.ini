[pytest]
markers =
    slow: transient/ODE-integration tests, deselected by default (see doc/architecture.md P15)

## Slow tests are OFF by default.  They are integration-heavy transient runs
## that together are roughly half the suite's wall time, and the fast subset
## is what a developer wants on every edit.
##
##   pytest pycircuit                 -> fast subset (default)
##   pytest pycircuit -m slow         -> only the slow ones
##   pytest pycircuit -m ""           -> everything
##
## THE RISK, stated because a default that hides tests is a real hazard:
## anything only these tests cover is unguarded on a normal run.  They are
## the only checks that compare the perturbation analysis against a
## time-domain reference, which is precisely the evidence class that caught
## the g_2 sign error the published-formula gates could not see.  CI and any
## release check MUST run with `-m ""`.
addopts = -m "not slow"
